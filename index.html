<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ملخصات | شبكات الحاسب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --neon-purple: #a855f7;
            --neon-blue: #3b82f6;
            --gradient-1: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
            --gradient-2: linear-gradient(135deg, #f97316 0%, #ec4899 100%);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        /* خلفية متحركة */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }
        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }
        .orb-1 { width: 600px; height: 600px; background: var(--neon-purple); top: -200px; right: -150px; }
        .orb-2 { width: 500px; height: 500px; background: var(--neon-blue); bottom: -150px; left: -100px; animation-delay: -7s; }
        .orb-3 { width: 400px; height: 400px; background: #ec4899; top: 60%; right: 40%; animation-delay: -14s; }
        @keyframes float {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px,-50px) scale(1.1); }
            66% { transform: translate(-20px,20px) scale(0.9); }
        }
        /* شريط التنقل ممتد بالكامل */
        .glass-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            background: rgba(15, 15, 20, 0.6);
            border: none;
            border-bottom: 1px solid var(--glass-border);
            width: 100%;
            padding: 0;
        }
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }
        .logo-icon {
            background: var(--gradient-1);
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.6rem;
        }
        .nav-links {
            display: flex;
            gap: 32px;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .nav-links a.active, .nav-links a:hover {
            color: white;
        }
        /* باقي التنسيقات */
        header {
            text-align: center;
            padding: 30px 0 20px;
        }
        .badge {
            background: rgba(168,85,247,0.15);
            color: var(--neon-purple);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 12px;
        }
        header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .gradient-text {
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .glass-controls {
            display: flex;
            gap: 16px;
            margin: 20px 0 30px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 16px 20px;
        }
        .search-box {
            flex: 2;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 40px;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .search-box i {
            color: var(--neon-purple);
            margin-left: 12px;
            font-size: 1rem;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 0.95rem;
        }
        .filter-box select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 40px;
            padding: 10px 18px;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .view-toggle {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 40px;
            padding: 5px;
        }
        .view-toggle button {
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .view-toggle button.active {
            background: var(--gradient-1);
            color: white;
        }
        #summariesContainer {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .view-transition {
            opacity: 0;
            transform: translateY(8px);
        }
        .cards-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            align-items: stretch;
        }
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 22px;
            transition: transform 0.2s ease, border 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(168,85,247,0.5);
        }
        .material-badge {
            background: var(--gradient-1);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .card-header i {
            font-size: 1.5rem;
            color: var(--neon-purple);
        }
        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .preview {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 20px;
            line-height: 1.5;
            flex: 1;
        }
        .card button {
            width: 100%;
            background: var(--gradient-1);
            border: none;
            padding: 10px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin-top: auto;
        }
        .card button:hover {
            opacity: 0.85;
            transform: scale(0.98);
        }
        .flashcards-view {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            align-items: flex-start;
        }
        .flashcard {
            width: 300px;
            background: transparent;
            perspective: 1000px;
            cursor: pointer;
            transition: height 0.3s ease;
            height: auto;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
        }
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            width: 100%;
            backface-visibility: hidden;
            border-radius: 28px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .flashcard-front {
            background: var(--gradient-1);
            color: white;
            text-align: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .flashcard-back {
            background: rgba(15,15,20,0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transform: rotateY(180deg);
            position: absolute;
            top: 0;
            left: 0;
            text-align: right;
            justify-content: flex-start;
        }
        .flashcard-front .material-badge {
            background: rgba(255,255,255,0.2);
            margin-bottom: 12px;
        }
        .flashcard-front i {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .flashcard-back div {
            font-size: 0.85rem;
            line-height: 1.55;
            color: var(--text-secondary);
            width: 100%;
        }
        /* مودال */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: rgba(20,20,28,0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: fadeInUp 0.25s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            font-size: 1.5rem;
            margin: 0;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .close-btn {
            cursor: pointer;
            font-size: 2rem;
            color: rgba(255,255,255,0.6);
            transition: 0.2s;
            line-height: 1;
            background: none;
            border: none;
            padding: 0;
        }
        .close-btn:hover {
            color: white;
        }
        .modal-body {
            color: var(--text-secondary);
            line-height: 1.65;
        }
        .no-results {
            text-align: center;
            padding: 50px;
            background: var(--bg-card);
            border-radius: 28px;
            font-size: 1.1rem;
        }
        footer {
            text-align: center;
            padding: 30px 0 25px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 50px;
            border-top: 1px solid var(--glass-border);
        }
        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .glass-controls { flex-direction: column; align-items: stretch; gap: 12px; }
            .view-toggle { justify-content: center; }
            header h1 { font-size: 1.8rem; }
            .flashcard { width: 280px; }
            .cards-view { gap: 20px; }
            .nav-container { flex-direction: column; gap: 12px; }
            .logo-text { font-size: 1.3rem; }
            .nav-links { gap: 20px; }
            .nav-links a { font-size: 1rem; }
            .modal-content { padding: 24px; }
        }
    </style>
</head>
<body>
<div class="bg-animation">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
</div>

<nav class="glass-nav">
    <div class="nav-container">
        <a href="#" class="logo">
            <span class="logo-icon"><i class="fas fa-layer-group"></i></span>
            <span class="logo-text">ملخصات</span>
        </a>
        <div class="nav-links">
            <a href="#" class="active">الرئيسية</a>
            <a href="#">ملخصات</a>
        </div>
    </div>
</nav>

<header>
    <div class="container">
        <span class="badge">⚡ شبكات الحاسب</span>
        <h1>ملخصات <span class="gradient-text">بطريقة مختلفة</span></h1>
        <p>حوِّل المواد الدراسية إلى تجربة بصرية تفاعلية</p>
    </div>
</header>

<main class="container">
    <div class="glass-controls">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن ملخص...">
        </div>
        <div class="filter-box">
            <select id="subjectFilter">
                <option value="all">كل المواد</option>
            </select>
        </div>
        <div class="view-toggle">
            <button class="active" data-view="cards"><i class="fas fa-th-large"></i> بطاقات</button>
            <button data-view="flashcards"><i class="fas fa-clone"></i> فلاش كارد</button>
        </div>
    </div>

    <div id="summariesContainer" class="cards-view"></div>
</main>

<footer>
    <p>© 2026 ملخصات – شبكات الحاسب الآلي</p>
</footer>

<script>
    const summariesData = [
        { id:1, material:"شبكات الحاسب", title:"الشبكات اللاسلكية", icon:"fas fa-wifi", preview:"مميزات وعيوب وأنواع التقنيات", 
            fullContent: `<strong><i class="fas fa-check-circle" style="color: #22c55e;"></i> مميزات الشبكات اللاسلكية:</strong><br>• سهولة التركيب وعدم الحاجة لكابلات<br>• مرونة عالية وتكلفة أقل<br><br><strong><i class="fas fa-times-circle" style="color: #ef4444;"></i> عيوب:</strong><br>• تشويش وتداخل في الإشارة<br>• نطاق تغطية محدود<br>• استهلاك أكبر للطاقة<br><br><strong><i class="fas fa-network-wired"></i> أنواع التقنيات:</strong><br>• Bluetooth (مسافات قصيرة)<br>• Wi-Fi (الأكثر انتشاراً)<br>• WiMAX (مسافات أطول)` },
        { id:2, material:"شبكات الحاسب", title:"تقنية Bluetooth", icon:"fab fa-bluetooth", preview:"مبدأ العمل، المدى، المميزات", 
            fullContent: `<strong><i class="fas fa-microchip"></i> آلية العمل:</strong><br>• تعتمد على القفز الترددي (Frequency Hopping) لتقليل التداخل<br>• تعمل في نطاق 2.4 جيجاهرتز<br>• 79 قناة<br><br><strong><i class="fas fa-arrows-alt-h"></i> المدى:</strong><br>• من 30 إلى 300 قدم حسب البيئة<br><br><strong><i class="fas fa-star" style="color: #fbbf24;"></i> مميزات:</strong><br>• قليل التكلفة<br>• مقاوم للتداخل<br>• تردد غير مرخص<br><br><strong><i class="fas fa-exclamation-triangle" style="color: #f97316;"></i> حدود:</strong><br>• سرعة محدودة<br>• مناسب للملفات الصغيرة فقط` },
        { id:3, material:"شبكات الحاسب", title:"الراوتر (Router)", icon:"fas fa-network-wired", preview:"وظائف، مميزات وعيوب", 
            fullContent: `<strong><i class="fas fa-cogs"></i> وظائف الراوتر:</strong><br>• توجيه حركة المرور بين الشبكات<br>• ربط شبكات مختلفة<br>• تحسين أمان الشبكة<br><br><strong><i class="fas fa-thumbs-up" style="color: #22c55e;"></i> مميزات:</strong><br>• كفاءة عالية وسرعة استجابة<br>• يعمل عبر عناوين IP<br>• يربط عدة أجهزة دون تأثير<br><br><strong><i class="fas fa-thumbs-down" style="color: #ef4444;"></i> عيوب:</strong><br>• يحتاج خبرة في الإعداد<br>• تكلفة أعلى من Switch/Hub<br>• قد يحدث تأخير إذا كانت المسافة بعيدة` },
        { id:4, material:"شبكات الحاسب", title:"البوابة (Gateway)", icon:"fas fa-door-open", preview:"تعريف، أنواع، مزايا", 
            fullContent: `<strong><i class="fas fa-info-circle"></i> تعريف البوابة:</strong><br>• جهاز يربط بين شبكتين مختلفتين كلياً ويعمل كمترجم بروتوكولات<br>• يعمل في جميع طبقات OSI Model<br><br><strong><i class="fas fa-tags"></i> أنواع البوابات:</strong><br>• Gateway شبكة (الأكثر شيوعاً)<br>• بوابة تخزين سحابي<br>• بوابة IoT<br>• بوابة VoIP<br><br><strong><i class="fas fa-shield-alt" style="color: #a855f7;"></i> مزايا:</strong><br>• أمان عالي ومراقبة كل حركة المرور<br>• ربط شبكات مختلفة<br>• تعمل كمحول بروتوكولات` },
        { id:5, material:"شبكات الحاسب", title:"بروتوكولات الأمان", icon:"fas fa-shield-alt", preview:"SSL/TLS وبروتوكولات أخرى", 
            fullContent: `<strong><i class="fas fa-lock"></i> بروتوكولات الأمان:</strong><br>• SSL/TLS: تشفير البيانات أثناء النقل وحماية كلمات المرور والبطاقات البنكية.<br><br><strong><i class="fas fa-list"></i> بروتوكولات أخرى مهمة:</strong><br>• ARP: تحويل IP إلى MAC<br>• ICMP: أخطاء الشبكة وأمر Ping<br>• BGP: التوجيه بين مزودي الخدمة<br>• SNMP: إدارة الشبكات<br>• SIP: مكالمات VoIP<br>• RTP: نقل الصوت والفيديو الحي<br>• NTP: مزامنة الوقت` },
        { id:6, material:"شبكات الحاسب", title:"IP - Protocol - Port", icon:"fas fa-network-wired", preview:"متطلبات التواصل بين الأجهزة", 
            fullContent: `<strong><i class="fas fa-address-card"></i> عنوان IP:</strong><br>• رقم تعريف فريد للجهاز على الشبكة، مثال 192.168.1.1<br><br><strong><i class="fas fa-code-branch"></i> البروتوكول (Protocol):</strong><br>• برنامج يحدد نوع الاتصال مثل HTTP.<br><br><strong><i class="fas fa-plug"></i> المنفذ (Port):</strong><br>• بوابة برمجية تتراوح من 0 إلى 65535.<br><br><strong><i class="fas fa-chart-simple"></i> أشهر البروتوكولات والمنافذ:</strong><br>• HTTP: 80<br>• SMTP (إرسال البريد): 25<br>• POP (استقبال البريد): 110<br>• FTP: 21<br>• DNS: 53<br>• Telnet: 23` },
        { id:7, material:"شبكات الحاسب", title:"Bridge وطبقات الشبكة", icon:"fas fa-code-branch", preview:"أنواع Bridges ومفهوم الطبقات", 
            fullContent: `<strong><i class="fas fa-sitemap"></i> أنواع الـ Bridge:</strong><br>• Adaptive Learning Bridge: يتعلم عناوين الأجهزة تلقائياً<br>• Spanning Tree Bridge: يمنع الدوران عند تعطل Bridge آخر<br>• Load Balance Bridge: يحسن الأداء بتوزيع الحمل<br><br><strong><i class="fas fa-layer-group"></i> طبقات الشبكة (Layers):</strong><br>• كل طبقة تقدم خدمة للطبقة الأعلى<br>• وتطلب خدمة من الطبقة الأدنى<br>• تعتمد على معايير ISO ونموذج OSI` }
    ];

    let currentView = 'cards';
    let isTransitioning = false;

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function populateFilter() {
        const materials = [...new Set(summariesData.map(s => s.material))];
        const select = document.getElementById('subjectFilter');
        select.innerHTML = '<option value="all">كل المواد</option>';
        materials.forEach(m => { select.innerHTML += `<option value="${m}">${m}</option>`; });
    }

    function getFiltered() {
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        const subject = document.getElementById('subjectFilter').value;
        return summariesData.filter(s => 
            (subject === 'all' || s.material === subject) &&
            (search === '' || s.title.toLowerCase().includes(search) || s.preview.toLowerCase().includes(search))
        );
    }

    function showModal(title, content) {
        let modal = document.querySelector('.modal');
        if (modal) modal.remove();
        modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <div class="modal-header">
                    <h2>${escapeHtml(title)}</h2>
                    <button class="close-btn">&times;</button>
                </div>
                <div class="modal-body">${content}</div>
            </div>
        `;
        document.body.appendChild(modal);
        const closeBtn = modal.querySelector('.close-btn');
        closeBtn.onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    }

    function adjustFlashcardHeight(flashcard) {
        const inner = flashcard.querySelector('.flashcard-inner');
        const front = flashcard.querySelector('.flashcard-front');
        const back = flashcard.querySelector('.flashcard-back');
        if (!inner || !front || !back) return;
        if (flashcard.classList.contains('flipped')) {
            const backHeight = back.scrollHeight;
            flashcard.style.height = backHeight + 'px';
            inner.style.height = backHeight + 'px';
        } else {
            const frontHeight = front.scrollHeight;
            flashcard.style.height = frontHeight + 'px';
            inner.style.height = frontHeight + 'px';
        }
    }

    function closeAllOtherFlashcards(currentCard) {
        const allCards = document.querySelectorAll('.flashcard');
        allCards.forEach(card => {
            if (card !== currentCard && card.classList.contains('flipped')) {
                card.classList.remove('flipped');
                adjustFlashcardHeight(card);
            }
        });
    }

    function renderContent() {
        const container = document.getElementById('summariesContainer');
        const filtered = getFiltered();
        if (!filtered.length) {
            container.innerHTML = '<div class="no-results">😔 لا توجد ملخصات تطابق بحثك</div>';
            return;
        }

        if (currentView === 'cards') {
            container.className = 'cards-view';
            container.innerHTML = filtered.map(s => `
                <div class="card">
                    <div class="card-header">
                        <i class="${s.icon}"></i>
                        <span class="material-badge">${escapeHtml(s.material)}</span>
                    </div>
                    <h3>${escapeHtml(s.title)}</h3>
                    <p class="preview">${escapeHtml(s.preview)}</p>
                    <button class="view-btn" data-id="${s.id}"><i class="fas fa-eye"></i> عرض الملخص</button>
                </div>
            `).join('');
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    const sum = summariesData.find(s => s.id === id);
                    if (sum) showModal(sum.title, sum.fullContent);
                });
            });
        } 
        else if (currentView === 'flashcards') {
            container.className = 'flashcards-view';
            container.innerHTML = filtered.map(s => `
                <div class="flashcard" data-id="${s.id}">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <i class="${s.icon}"></i>
                            <span class="material-badge">${escapeHtml(s.material)}</span>
                            <h3>${escapeHtml(s.title)}</h3>
                            <small>اضغط للإجابة</small>
                        </div>
                        <div class="flashcard-back">
                            <div>${s.fullContent}</div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.flashcard').forEach(flashcard => {
                adjustFlashcardHeight(flashcard);
                
                flashcard.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (flashcard.classList.contains('flipped')) {
                        flashcard.classList.remove('flipped');
                        adjustFlashcardHeight(flashcard);
                    } else {
                        closeAllOtherFlashcards(flashcard);
                        flashcard.classList.add('flipped');
                        adjustFlashcardHeight(flashcard);
                    }
                });
            });
            
            window.addEventListener('resize', () => {
                document.querySelectorAll('.flashcard').forEach(flashcard => {
                    adjustFlashcardHeight(flashcard);
                });
            });
        }
    }

    function renderWithTransition() {
        if (isTransitioning) return;
        const container = document.getElementById('summariesContainer');
        isTransitioning = true;
        container.classList.add('view-transition');
        setTimeout(() => {
            renderContent();
            container.classList.remove('view-transition');
            setTimeout(() => { isTransitioning = false; }, 100);
        }, 120);
    }

    function setup() {
        populateFilter();
        renderContent();
        document.getElementById('searchInput').addEventListener('input', renderWithTransition);
        document.getElementById('subjectFilter').addEventListener('change', renderWithTransition);
        document.querySelectorAll('.view-toggle button').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.dataset.view === currentView) return;
                document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentView = this.dataset.view;
                renderWithTransition();
            });
        });
    }

    document.addEventListener('DOMContentLoaded', setup);
</script>
</body>
</html>
