<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ملخصات | شبكات الحاسب - اختبار تفاعلي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --neon-purple: #a855f7;
            --neon-blue: #3b82f6;
            --gradient-1: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
            --gradient-2: linear-gradient(135deg, #f97316 0%, #ec4899 100%);
        }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-dark); color: var(--text-primary); line-height: 1.5; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }
        .gradient-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: float 20s infinite ease-in-out; }
        .orb-1 { width: 600px; height: 600px; background: var(--neon-purple); top: -200px; right: -150px; }
        .orb-2 { width: 500px; height: 500px; background: var(--neon-blue); bottom: -150px; left: -100px; animation-delay: -7s; }
        .orb-3 { width: 400px; height: 400px; background: #ec4899; top: 60%; right: 40%; animation-delay: -14s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(30px,-50px) scale(1.1);} 66%{transform:translate(-20px,20px) scale(0.9);} }
        .glass-nav { position: sticky; top: 0; z-index: 100; backdrop-filter: blur(16px); background: rgba(15,15,20,0.6); border-bottom: 1px solid var(--glass-border); }
        .nav-container { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 15px 20px; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; color: white; text-decoration: none; }
        .logo-icon { background: var(--gradient-1); width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .logo-text { font-weight: 700; font-size: 1.6rem; }
        .nav-links { display: flex; gap: 32px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 1.2rem; transition: 0.2s; cursor: pointer; }
        .nav-links a.active, .nav-links a:hover { color: white; }
        header { text-align: center; padding: 30px 0 20px; }
        .badge { background: rgba(168,85,247,0.15); color: var(--neon-purple); padding: 4px 14px; border-radius: 50px; font-size: 0.8rem; display: inline-block; margin-bottom: 12px; }
        header h1 { font-size: 2.3rem; font-weight: 800; margin-bottom: 8px; }
        .gradient-text { background: var(--gradient-2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--text-secondary); font-size: 1rem; max-width: 500px; margin: 0 auto; }
        .glass-controls { display: flex; gap: 16px; margin: 20px 0 30px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 16px 20px; }
        .search-box { flex: 2; min-width: 200px; display: flex; align-items: center; background: rgba(255,255,255,0.05); border-radius: 40px; padding: 10px 18px; border: 1px solid rgba(255,255,255,0.08); }
        .search-box i { color: var(--neon-purple); margin-left: 12px; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; }
        .filter-box select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 40px; padding: 10px 18px; color: white; cursor: pointer; }
        .filter-box select option {
            background: #1a1a2e;
            color: white;
        }
        .view-toggle { display: flex; gap: 8px; background: rgba(255,255,255,0.03); border-radius: 40px; padding: 5px; }
        .view-toggle button { padding: 8px 20px; border: none; background: transparent; color: var(--text-secondary); border-radius: 30px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .view-toggle button.active { background: var(--gradient-1); color: white; }
        #summariesContainer { transition: opacity 0.2s ease, transform 0.2s ease; }
        .view-transition { opacity: 0; transform: translateY(8px); }
        .cards-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px; align-items: stretch; }
        .card, .material-card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 28px; padding: 22px; transition: transform 0.2s ease, border 0.2s; display: flex; flex-direction: column; height: 100%; cursor: pointer; }
        .card:hover, .material-card:hover { transform: translateY(-5px); border-color: rgba(168,85,247,0.5); }
        .material-badge { background: var(--gradient-1); padding: 4px 14px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; display: inline-block; margin-bottom: 12px; }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .card-header i { font-size: 1.5rem; color: var(--neon-purple); }
        .card h3, .material-card h3 { font-size: 1.25rem; margin-bottom: 10px; }
        .preview { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; flex: 1; }
        .card button, .material-card button { width: 100%; background: var(--gradient-1); border: none; padding: 10px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; transition: 0.15s; margin-top: auto; }
        .flashcards-view { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
        .flashcard { width: 300px; background: transparent; perspective: 1000px; cursor: pointer; transition: height 0.3s ease; height: auto; }
        .flashcard-inner { position: relative; width: 100%; transition: transform 0.5s ease; transform-style: preserve-3d; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { width: 100%; backface-visibility: hidden; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
        .flashcard-front { background: var(--gradient-1); color: white; text-align: center; align-items: center; position: relative; z-index: 2; }
        .flashcard-back { background: rgba(15,15,20,0.95); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); transform: rotateY(180deg); position: absolute; top: 0; left: 0; text-align: right; justify-content: flex-start; }
        .flashcard-front i { font-size: 2.2rem; margin-bottom: 10px; }
        .flashcard-back div { font-size: 0.85rem; line-height: 1.55; color: var(--text-secondary); width: 100%; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: rgba(20,20,28,0.95); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 28px; padding: 32px; max-width: 800px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative; animation: fadeInUp 0.25s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 1.5rem; margin: 0; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-btn { cursor: pointer; font-size: 2rem; color: rgba(255,255,255,0.6); background: none; border: none; }
        .close-btn:hover { color: white; }
        .modal-body { color: var(--text-secondary); line-height: 1.65; }
        .no-results { text-align: center; padding: 50px; background: var(--bg-card); border-radius: 28px; }
        footer { text-align: center; padding: 30px 0 25px; color: var(--text-secondary); font-size: 0.8rem; margin-top: 50px; border-top: 1px solid var(--glass-border); }
        .reminder-toast { position: fixed; top: 20px; right: -300px; background: rgba(0,0,0,0.85); backdrop-filter: blur(16px); border-right: 5px solid var(--neon-purple); border-radius: 12px 0 0 12px; padding: 14px 24px; font-size: 1.15rem; font-weight: 500; color: white; z-index: 10001; box-shadow: -5px 5px 20px rgba(0,0,0,0.4); transition: right 0.4s ease-out, opacity 0.8s ease-out; cursor: pointer; white-space: nowrap; }
        .reminder-toast.show { right: 0; }
        .reminder-toast.hide { opacity: 0; right: -300px; }
        /* أنماط التبويب للأسئلة */
        .quiz-tabs { display: flex; gap: 12px; margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 8px 20px; border-radius: 40px; color: var(--text-secondary); cursor: pointer; transition: 0.2s; font-weight: 500; }
        .tab-btn.active { background: var(--gradient-1); color: white; border-color: transparent; }
        .tab-pane { display: none; animation: fadeIn 0.2s ease; }
        .tab-pane.active-pane { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .quiz-question { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); }
        .quiz-question h4 { font-size: 1.1rem; margin-bottom: 12px; color: var(--neon-purple); }
        .quiz-options { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
        .quiz-options label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .true-false { display: flex; gap: 20px; margin-top: 10px; }
        .essay-input { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px; color: white; font-family: inherit; margin-top: 10px; }
        .match-row { display: flex; gap: 20px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        .match-left { flex: 1; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; }
        /* تعديل لون مربع التوصيل ليكون غامقاً والنص أبيض */
        .match-right select {
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.98), rgba(25, 25, 40, 0.98));
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        .match-right select option {
            background: #14141f;
            color: white;
            padding: 8px;
        }
        .match-right select:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }
        .quiz-feedback { margin-top: 20px; padding: 12px; border-radius: 16px; background: rgba(0,0,0,0.5); }
        .quiz-submit { background: var(--gradient-1); border: none; padding: 12px 24px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .reset-match-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 30px; padding: 8px 20px; margin-top: 10px; cursor: pointer; color: white; font-size: 0.85rem; }
        @media (max-width: 768px) {
            .reminder-toast { top: 10px; padding: 10px 20px; font-size: 1rem; }
            .container { padding: 0 16px; }
            .glass-controls { flex-direction: column; align-items: stretch; gap: 12px; }
            .view-toggle { justify-content: center; }
            header h1 { font-size: 1.8rem; }
            .flashcard { width: 280px; }
            .cards-view { gap: 20px; }
            .nav-container { flex-direction: column; gap: 12px; }
            .logo-text { font-size: 1.3rem; }
            .nav-links { gap: 20px; }
            .nav-links a { font-size: 1rem; }
            .modal-content { padding: 24px; }
            .quiz-tabs { gap: 8px; }
            .tab-btn { padding: 6px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="bg-animation"><div class="gradient-orb orb-1"></div><div class="gradient-orb orb-2"></div><div class="gradient-orb orb-3"></div></div>
<nav class="glass-nav"><div class="nav-container"><div class="logo" id="homeLogoBtn"><span class="logo-icon"><i class="fas fa-layer-group"></i></span><span class="logo-text">ملخصات</span></div><div class="nav-links"><a id="homeNavBtn" class="active">الرئيسية</a><a>ملخصات</a></div></div></nav>
<header><div class="container"><span class="badge">⚡ شبكات الحاسب</span><h1>ملخصات <span class="gradient-text">بطريقة مختلفة</span></h1><p>اختر المادة ثم تصفح الملخصات واختبر فهمك</p></div></header>
<main class="container"><div class="glass-controls"><div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="ابحث عن مادة أو ملخص..."></div><div class="filter-box"><select id="subjectFilter"><option value="all">كل المواد</option></select></div><div class="view-toggle"><button class="active" data-view="cards"><i class="fas fa-th-large"></i> بطاقات</button><button data-view="flashcards"><i class="fas fa-clone"></i> فلاش كارد</button></div></div><div id="summariesContainer" class="cards-view"></div></main>
<footer><p>© 2026 ملخصات – شبكات الحاسب الآلي -
<br />
ملخصات شاملة المحاضرات </p></footer>

<script>
    // ---------- جميع الملخصات 27 (نص كامل) ----------
    const summariesData = [
        { id:1, material:"شبكات الحاسب", title:"فوائد الشبكات", icon:"fas fa-chalkboard-user", preview:"مشاركة الموارد، الاتصالات، الأمان، مجموعات العمل",
            fullContent: `<strong><i class="fas fa-share-alt"></i> فوائد الشبكات:</strong><br><strong>1. مشاركة الموارد:</strong> طابعات، أقراص صلبة، برامج.<br><strong>2. الاتصالات:</strong> بريد إلكتروني، محادثة فورية، مؤتمرات فيديو.<br><strong>3. مجموعات العمل:</strong> تنظيم مستخدمين للعمل على نفس الملفات مع صلاحيات.<br><strong>4. توفير البرمجيات:</strong> نسخ مجانية للطلاب (مثل 365).<br><strong>5. الأمان (Security):</strong> تحديد مساحات عمل خاصة لكل مستخدم.<br><strong>6. مجالات الاستخدام:</strong> التعليم، الترفيه، التجارة الإلكترونية، البحث، التواصل الاجتماعي.` },
        { id:2, material:"شبكات الحاسب", title:"الند للند (Peer-to-Peer)", icon:"fas fa-users", preview:"تساوي الأجهزة في الحقوق، لا يوجد خادم مركزي",
            fullContent: `<strong><i class="fas fa-equals"></i> خصائص شبكة الند للند:</strong><br>• لا يوجد خادم (Server) متخصص: كل جهاز يعمل كخادم وعميل.<br>• مشاركة الموارد: طابعات وملفات بين الأجهزة.<br>• عدد محدود: مثالية للمجموعات حتى 10 أجهزة.<br>• مناسبة للمنازل والمكاتب الصغيرة.<br>• سهولة التركيب والتكلفة المنخفضة.` },
        { id:3, material:"شبكات الحاسب", title:"خادم / عميل (Client/Server)", icon:"fas fa-server", preview:"خادم مركزي يخدم الأجهزة (العملاء)",
            fullContent: `<strong><i class="fas fa-star-of-life"></i> خصائص Client/Server:</strong><br>• خادم مركزي يدير الشبكة ويستقبل الطلبات (Requests).<br>• ميزات: نسخ احتياطي مركزي (Backup) - مثل نظام ابن الهيثم بجامعة بنها.<br>• قدرة استيعابية: آلاف الأجهزة دون ضعف بالأداء.<br>• سرعة عالية: عمل في اتجاهين (Full Duplex).<br>• الأمان: يحتاج برامج حماية متطورة لأن الخادم هدف للاختراق.` },
        { id:4, material:"شبكات الحاسب", title:"LAN - الشبكة المحلية", icon:"fas fa-building", preview:"تغطي منطقة محدودة: بيت، مبنى، حرم جامعي",
            fullContent: `<strong><i class="fas fa-map-marker-alt"></i> خصائص LAN:</strong><br>• نطاق جغرافي: داخل سور واحد (جامعة القاهرة أو عين شمس مثلاً).<br>• عدد الأجهزة: من 2 إلى 500 جهاز.<br>• إدارة مركزية: يوجد مدير شبكة يتحكم في الصلاحيات.<br>• سرعة عالية جداً (جيجابت/ثانية).<br>• تكلفة منخفضة نسبياً.` },
        { id:5, material:"شبكات الحاسب", title:"MAN - الشبكة الإقليمية", icon:"fas fa-city", preview:"تربط شبكات محلية في مدينة كاملة حتى 50 كم",
            fullContent: `<strong><i class="fas fa-charging-station"></i> خصائص MAN:</strong><br>• نطاق جغرافي: من 5 إلى 50 كيلومتر (مدينة أو محافظة).<br>• طريقة التكوين: مجموعة شبكات LAN مرتبطة معاً.<br>• تستخدمها شركات الاتصالات والجامعات المتفرعة.<br>• سرعة أقل من LAN ولكنها تغطي مساحة أكبر.` },
        { id:6, material:"شبكات الحاسب", title:"WAN - الشبكة الواسعة", icon:"fas fa-globe", preview:"تغطي قارات ودول (مثال: الإنترنت)",
            fullContent: `<strong><i class="fas fa-globe-americas"></i> خصائص WAN:</strong><br>• نطاق جغرافي: دول وقارات (أكثر من 100 كم).<br>• لا توجد إدارة مركزية موحدة (مثل الإنترنت).<br>• تربط شبكات LAN و MAN معاً.<br>• تستخدم كابلات تحت المحيطات وأقمار صناعية.<br>• أبطأ سرعة بسبب المسافات الطويلة.` },
        { id:7, material:"شبكات الحاسب", title:"PAN - الشبكة الشخصية", icon:"fas fa-user", preview:"ربط أجهزة خاصة بشخص واحد في نطاق محدود",
            fullContent: `<strong><i class="fas fa-bluetooth"></i> تعريف PAN:</strong><br>• تغطي مساحة شخصية جداً (مترين إلى 10 أمتار).<br>• أمثلة: ربط هاتف بسماعة بلوتوث، ربط لابتوب بجهاز لوحي.<br>• تقنيات: Bluetooth، Zigbee، NFC.<br>• استخدام يومي في المنزل أو المكتب الشخصي.` },
        { id:8, material:"شبكات الحاسب", title:"Bus Topology (الخطية)", icon:"fas fa-grip-lines", preview:"خط واحد (باكيون) وجميع الأجهزة عليه",
            fullContent: `<strong><i class="fas fa-road"></i> الشبكة الخطية (Bus):</strong><br>• الشكل: خط مستقيم (كابل واحد ممتد).<br>• طريقة العمل: إشارة تمر على جميع الأجهزة، والجهاز المقصود يلتقطها.<br>• بروتوكول CSMA/CD لمنع التصادم.<br>• المزايا: سهلة ورخيصة، إضافة الأجهزة سهلة.<br>• العيوب: بطيئة عند كثرة الأجهزة، تعطل الكابل الرئيسي يوقف الشبكة بالكامل.` },
        { id:9, material:"شبكات الحاسب", title:"Ring Topology (الحلقية)", icon:"fas fa-circle", preview:"دائرة مغلقة، البيانات تنتقل في اتجاه واحد",
            fullContent: `<strong><i class="fas fa-ring"></i> الشبكة الحلقية (Ring):</strong><br>• الشكل: دائرة مغلقة (البداية متصلة بالنهاية).<br>• طريقة العمل: تمر البيانات في اتجاه واحد (أو اتجاهين في الأنواع المطورة).<br>• كل جهاز يعيد إرسال الإشارة للجهاز التالي.<br>• المزايا: أداء منتظم، سهولة توقع زمن الوصول.<br>• العيوب: عطل جهاز واحد قد يعطل الحلقة (يوجد حلول مثل الحلقة المزدوجة).` },
        { id:10, material:"شبكات الحاسب", title:"Star Topology (النجمية)", icon:"fas fa-star", preview:"نقطة مركزية (سويتش/هاب) تتصل بها كل الأجهزة",
            fullContent: `<strong><i class="fas fa-star-of-life"></i> الشبكة النجمية (Star):</strong><br>• الشكل: جهاز مركزي (Hub أو Switch) وكل الأجهزة متصلة به بكابل منفصل.<br>• المزايا: سهولة اكتشاف الأعطال، إضافة أو حذف أجهزة دون تعطيل الشبكة، أمان أفضل.<br>• العيوب: لو تعطل الجهاز المركزي تتعطل الشبكة بالكامل، تكلفة كابلات أعلى.<br>• الأكثر استخداماً في الشبكات المنزلية وأقسام الشركات.` },
        { id:11, material:"شبكات الحاسب", title:"Hybrid (المختلطة)", icon:"fas fa-project-diagram", preview:"خليط من Bus, Ring, Star في شبكة واحدة",
            fullContent: `<strong><i class="fas fa-blender"></i> الشبكة المختلطة (Hybrid):</strong><br>• تجمع بين نوعين أو أكثر من التضاريس (مثل نجمة + خطية).<br>• تستخدم في المؤسسات الكبيرة التي تحتاج أقساماً متنوعة.<br>• مزايا: مرونة عالية، قابلية للتوسع، أداء محسن.<br>• عيوب: تصميم معقد، تكلفة أعلى، إدارة أصعب.` },
        { id:12, material:"شبكات الحاسب", title:"الشبكات اللاسلكية", icon:"fas fa-wifi", preview:"أنواعها، مميزات وعيوب، تقنيات",
            fullContent: `<strong><i class="fas fa-check-circle" style="color: #22c55e;"></i> مميزات:</strong><br>• سهولة التركيب وحرية التنقل<br>• مرونة عالية<br><br><strong><i class="fas fa-times-circle" style="color: #ef4444;"></i> عيوب:</strong><br>• تداخل الإشارات وسهولة الاختراق<br>• نطاق تغطية محدود<br><br><strong><i class="fas fa-network-wired"></i> التقنيات:</strong><br>• Bluetooth (قصيرة)<br>• Wi-Fi (الأكثر انتشاراً)<br>• WiMAX (مسافات طويلة للأجهزة المتحركة)` },
        { id:13, material:"شبكات الحاسب", title:"وسائط سلكية - Twisted Pair", icon:"fas fa-plug", preview:"أزواج مفتوحة من الأسلاك النحاسية",
            fullContent: `<strong><i class="fas fa-tape"></i> الأزواج المفتوحة (Twisted Pair):</strong><br>• نوعان: UTP (غير محمي) و STP (محمي).<br>• يستخدم في شبكات الهاتف وشبكات الحاسب (Cat5, Cat6).<br>• الوصلة المستقيمة (Straight): لتوصيل أجهزة مختلفة (مثل كمبيوتر بسويتش).<br>• الوصلة المعكوسة (Cross-over): لتوصيل جهازين متشابهين (كمبيوتر بكمبيوتر).<br>• أقصى مسافة 100 متر.` },
        { id:14, material:"شبكات الحاسب", title:"كابل محوري (Coaxial)", icon:"fas fa-broadcast-tower", preview:"مثل كابل الدش، يستخدم للتلفزيون والإنترنت قديماً",
            fullContent: `<strong><i class="fas fa-satellite-dish"></i> الكابل المحوري:</strong><br>• التركيب: قلب نحاسي، عازل، شبكة معدنية (Shield)، غطاء خارجي.<br>• أنواع: Thinnet (رفيع - 185 متر) و Thicknet (سميك - 500 متر).<br>• موصلات BNC، T-Connector، Terminator.<br>• يستخدم حالياً في شبكات التلفزيون الكبلي وبعض التطبيقات القديمة.` },
        { id:15, material:"شبكات الحاسب", title:"الألياف الضوئية (Fiber Optics)", icon:"fas fa-fiber", preview:"شعيرات زجاجية تنقل الضوء بسرعات هائلة",
            fullContent: `<strong><i class="fas fa-lightbulb"></i> مميزات الألياف الضوئية:</strong><br>• مسافات بعيدة جداً (كيلومترات) وسرعات هائلة (تيرابت/ثانية).<br>• مناعة تامة ضد التداخل الكهرومغناطيسي.<br>• يصعب التنصت عليها (أمان عالي).<br>• عيوب: تكلفة عالية، تركيب دقيق، كسر سهل.<br>• تستخدم في البنية التحتية للإنترنت وشبكات WAN.` },
        { id:16, material:"شبكات الحاسب", title:"أجهزة الربط - Hub & Switch", icon:"fas fa-exchange-alt", preview:"الفرق بين الـ Hub والـ Switch",
            fullContent: `<strong><i class="fas fa-grip-horizontal"></i> Hub (الموزع):</strong><br>• يرسل البيانات لكل الأجهزة (Broadcast).<br>• يقسم السرعة على الأجهزة.<br>• يعمل بالطبقة الفيزيائية.<br><br><strong><i class="fas fa-code-branch"></i> Switch (المبدل):</strong><br>• يرسل لجهاز محدد فقط (باستخدام MAC Address).<br>• سرعة كاملة لكل جهاز.<br>• يتعلم العناوين تلقائياً.<br>• طرق النقل: Cut-through (سريع) و Store-and-Forward (آمن ودقيق).` },
        { id:17, material:"شبكات الحاسب", title:"Router (الموجه)", icon:"fas fa-network-wired", preview:"يربط بين شبكات مختلفة، يعتمد على IP",
            fullContent: `<strong><i class="fas fa-route"></i> وظائف الراوتر:</strong><br>• يربط بين شبكات مختلفة تماماً (مثل ربط شبكتك بالإنترنت).<br>• يختار أفضل مسار للبيانات.<br>• يخزن أسماء المستخدمين وكلمات المرور.<br>• أداؤه لا يتأثر بزيادة الأجهزة.<br><strong><i class="fas fa-exclamation-triangle"></i> عيوبه:</strong><br>• يحتاج خبرة في الإعداد، تكلفة أعلى من السويتش.<br><strong>الخلاصة:</strong> Hub يرسل للكل، Switch يرسل لجهاز محدد، Router يربط شبكات مختلفة.` },
        { id:18, material:"شبكات الحاسب", title:"Gateway (البوابة)", icon:"fas fa-door-open", preview:"تربط شبكتين مختلفتين وتترجم البروتوكولات",
            fullContent: `<strong><i class="fas fa-exchange-alt"></i> تعريف البوابة:</strong><br>• جهاز أو برنامج يربط شبكات مختلفة ويعمل كمترجم بروتوكولات.<br>• آلية العمل: جهازك ← بوابتك ← إنترنت ← بوابة خارجية ← بحث ← إرجاع النتائج.<br>• أنواعها: Address Gateway، Protocol Gateway، External/Internal Gateway.<br>• مزايا: أمان عالٍ، ربط شبكات غير متجانسة.` },
        { id:19, material:"شبكات الحاسب", title:"Bridge (الجسر)", icon:"fas fa-code-branch", preview:"يربط شبكتين ويجعلهما شبكة واحدة",
            fullContent: `<strong><i class="fas fa-bridge"></i> أنواع الجسور:</strong><br>• Transport Bridge: ينقل نوع واحد من البيانات.<br>• Mixed-Media Bridge: ينقل فيديو، صوت، نص (أبطأ لكن متعدد).<br>• Local Bridge: ربط شبكات داخلية بنفس المكان.<br>• Remote Bridge: ربط شبكات متباعدة جغرافيا.<br>• يساعد في تقسيم الحمل (Load balancing) وتقليل التصادمات.` },
        { id:20, material:"شبكات الحاسب", title:"Access Point & NIC", icon:"fas fa-wifi", preview:"نقطة الوصول وكارت الشبكة",
            fullContent: `<strong><i class="fas fa-broadcast-tower"></i> Access Point (نقطة الوصول):</strong><br>• يوسع نطاق الإشارة اللاسلكية.<br>• يعمل بنظام Half Duplex ويقسم السرعة.<br><strong><i class="fas fa-microchip"></i> NIC (كارت الشبكة):</strong><br>• يحول البيانات من رقمية إلى تناظرية (والعكس).<br>• لكل كارت عنوان فيزيائي فريد (MAC Address) عالمي.<br>• ضروري لأي جهاز للاتصال بالشبكة.` },
        { id:21, material:"شبكات الحاسب", title:"البروتوكولات - الأساسيات", icon:"fas fa-handshake", preview:"تعريف، آلية العمل، التغليف",
            fullContent: `<strong><i class="fas fa-book"></i> تعريف البروتوكول:</strong><br>• مجموعة قواعد ومعايير لتبادل البيانات بين الأجهزة.<br>• نظام قياسي تتابعي: بدء اتصال ← تبادل بيانات ← إنهاء اتصال.<br><strong><i class="fas fa-cogs"></i> آلية العمل:</strong><br>• المرسل: تقسيم البيانات إلى حزم (Packets) ← ترقيم ← تغليف (Encapsulation).<br>• المستقبل: التقاط الحزم ← إعادة التجميع ← فك التغليف (Decapsulation) ← تمرير للبرامج.<br>• تصحيح الأخطاء: إعادة إرسال الحزم المفقودة.` },

            fullContent: `<strong><i class="fas fa-globe"></i> HTTP:</strong><br>• ينقل النصوص والروابط بين المتصفح والخادم.<br>• آلية الطلب: المتصفح (عميل) ← طلب ← سيرفر ← رد ← عرض الصفحة.<br><strong><i class="fas fa-lock"></i> HTTPS:</strong><br>• النسخة الآمنة (باستخدام SSL/TLS).<br>• تشفير البيانات بالكامل، يمنع الاختراق والتنصت.<br>• إلزامي في البنوك والتسوق الإلكتروني.<br>• يظهر تحذير "اتصال غير آمن" إذا كان الموقع مشبوهاً.` },

        { id:25, material:"شبكات الحاسب", title:"IP, Ports, Protocols", icon:"fas fa-address-card", preview:"عنوان IP، المنفذ، البروتوكول - ثلاثية الاتصال",
            fullContent: `<strong><i class="fas fa-network-wired"></i> ثلاثية الاتصال:</strong><br>• IP Address: رقم تعريف فريد للجهاز (مثال 192.168.1.1). نوعان: Static (ثابت) و Dynamic (ديناميكي).<br>• Port: منفذ برمجي (0-65535). أمثلة: HTTP:80, FTP:21, SMTP:25, DNS:53.<br>• Protocol: القاعدة التي تشغل العملية (HTTP, FTP, SMTP...).<br><strong><i class="fas fa-shield-alt"></i> نصيحة أمنية:</strong> أمر MRT في Windows لإزالة البرامج الضارة.` },

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
    }

    function populateFilter() {
        const select = document.getElementById('subjectFilter');
        select.innerHTML = '<option value="all">كل المواد</option>';
        materialsList.forEach(m => { select.innerHTML += `<option value="${m.name}">${m.name}</option>`; });
    }

    function renderMatchQuestions(q, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        let html = `<div class="quiz-question"><h4>🔗 أسئلة التوصيل</h4>`;
        for (let i = 0; i < q.match.left.length; i++) {
            html += `
                <div class="match-row">
                    <div class="match-left">${escapeHtml(q.match.left[i])}</div>
                    <div class="match-right">
                        <select data-match-idx="${i}">
                            <option value="">-- اختر الإجابة --</option>
                            ${q.match.right.map((opt, idx) => `<option value="${idx}">${escapeHtml(opt)}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;
        }
        html += `<button class="reset-match-btn" id="resetMatchBtn_${containerId}">🔄 إعادة ضبط الإجابات</button>`;
        html += `<div class="quiz-feedback" id="match-feedback-${containerId}"></div></div>`;
        container.innerHTML = html;
        
        const resetBtn = document.getElementById(`resetMatchBtn_${containerId}`);
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                const selects = container.querySelectorAll('select[data-match-idx]');
                selects.forEach(select => select.value = '');
                const fb = document.getElementById(`match-feedback-${containerId}`);
                if (fb) fb.innerHTML = '';
            });
        }
    }

    function openQuiz(summaryId) {
        const q = questionsData[summaryId];
        if (!q) {
            showModal("تنبيه", "لا توجد أسئلة لهذا الملخص حالياً.");
            return;
        }
        const summaryTitle = summariesData.find(s => s.id === summaryId).title;
        const modalHtml = `
            <div class="modal-content">
                <div class="modal-header">
                    <h2>اختبر نفسك: ${escapeHtml(summaryTitle)}</h2>
                    <button class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="quiz-tabs">
                        <button class="tab-btn active" data-tab="mcq">📌 اختياري</button>
                        <button class="tab-btn" data-tab="tf">✅ صح/خطأ</button>
                        <button class="tab-btn" data-tab="match">🔗 توصيل</button>
                        <button class="tab-btn" data-tab="essay">✍️ مقالي</button>
                    </div>
                    <div id="tab-mcq" class="tab-pane active-pane">
                        <div class="quiz-question"><h4>📌 اختر الإجابة الصحيحة</h4><p>${escapeHtml(q.mcq.question)}</p><div class="quiz-options">
                            ${q.mcq.options.map((opt, idx) => `<label><input type="radio" name="mcq" value="${idx}"> ${escapeHtml(opt)}</label>`).join('')}
                        </div><div class="quiz-feedback" id="mcq-feedback"></div></div>
                    </div>
                    <div id="tab-tf" class="tab-pane">
                        <div class="quiz-question"><h4>✅ صح أم خطأ؟</h4><p>${escapeHtml(q.tf.statement)}</p><div class="true-false">
                            <label><input type="radio" name="tf" value="true"> صح</label>
                            <label><input type="radio" name="tf" value="false"> خطأ</label>
                        </div><div class="quiz-feedback" id="tf-feedback"></div></div>
                    </div>
                    <div id="tab-match" class="tab-pane">
                        <div id="match-container"></div>
                    </div>
                    <div id="tab-essay" class="tab-pane">
                        <div class="quiz-question"><h4>✍️ سؤال مقالي</h4><p>${escapeHtml(q.essay)}</p>
                        <textarea class="essay-input" id="essay-answer" rows="3" placeholder="اكتب إجابتك هنا..."></textarea>
                        <div class="quiz-feedback" id="essay-feedback"></div></div>
                    </div>
                    <button class="quiz-submit" id="submitQuiz">تصحيح الإجابات</button>
                </div>
            </div>
        `;
        
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = modalHtml;
        document.body.appendChild(modalDiv);
        
        renderMatchQuestions(q, 'match-container');
        
        const tabs = modalDiv.querySelectorAll('.tab-btn');
        const panes = modalDiv.querySelectorAll('.tab-pane');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.getAttribute('data-tab');
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                panes.forEach(pane => pane.classList.remove('active-pane'));
                const activePane = modalDiv.querySelector(`#tab-${tabId}`);
                if (activePane) activePane.classList.add('active-pane');
            });
        });
        
        const closeBtn = modalDiv.querySelector('.close-btn');
        closeBtn.onclick = () => modalDiv.remove();
        modalDiv.onclick = (e) => { if (e.target === modalDiv) modalDiv.remove(); };
        
        const submitBtn = modalDiv.querySelector('#submitQuiz');
        submitBtn.onclick = () => {
            const selectedMcq = modalDiv.querySelector('input[name="mcq"]:checked');
            const mcqCorrect = (selectedMcq && parseInt(selectedMcq.value) === q.mcq.correct);
            document.getElementById('mcq-feedback').innerHTML = mcqCorrect ? '✅ إجابة صحيحة!' : `❌ الإجابة الصحيحة هي: ${q.mcq.options[q.mcq.correct]}`;
            
            const selectedTf = modalDiv.querySelector('input[name="tf"]:checked');
            let tfCorrect = false;
            if (selectedTf) tfCorrect = (selectedTf.value === 'true' && q.tf.correct === true) || (selectedTf.value === 'false' && q.tf.correct === false);
            document.getElementById('tf-feedback').innerHTML = tfCorrect ? '✅ إجابة صحيحة!' : `❌ الإجابة الصحيحة هي: ${q.tf.correct ? 'صح' : 'خطأ'}`;
            
            let matchCorrect = 0;
            const selects = modalDiv.querySelectorAll('#match-container select[data-match-idx]');
            selects.forEach(select => {
                const idx = parseInt(select.getAttribute('data-match-idx'));
                const selectedVal = parseInt(select.value);
                if (!isNaN(selectedVal) && selectedVal === q.match.pairs[idx]) matchCorrect++;
            });
            const matchTotal = q.match.left.length;
            const matchFb = modalDiv.querySelector('#match-feedback-match-container');
            if (matchFb) matchFb.innerHTML = `✅ التوصيل: ${matchCorrect} من ${matchTotal} إجابات صحيحة.`;
            else {
                const fb = document.createElement('div');
                fb.className = 'quiz-feedback';
                fb.id = 'match-feedback-match-container';
                fb.innerHTML = `✅ التوصيل: ${matchCorrect} من ${matchTotal} إجابات صحيحة.`;
                const matchContainerDiv = modalDiv.querySelector('#match-container');
                if (matchContainerDiv) matchContainerDiv.appendChild(fb);
            }
            
            const essayAnswer = modalDiv.querySelector('#essay-answer').value;
            const essayFb = modalDiv.querySelector('#essay-feedback');
            if (essayFb) essayFb.innerHTML = essayAnswer.length > 10 ? '📝 تم استلام إجابتك. قارنها بالإجابة النموذجية في الملخص.' : '✏️ يرجى كتابة إجابة أطول.';
        };
    }

    // دوال العرض الأساسية (بدون أزرار اختبار شامل)
    function renderMaterials() {
        const container = document.getElementById('summariesContainer');
        const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
        let filteredMaterials = materialsList.filter(m => searchTerm === '' || m.name.toLowerCase().includes(searchTerm));
        if (filteredMaterials.length === 0) { container.innerHTML = '<div class="no-results">😔 لا توجد مواد</div>'; return; }
        if (currentView === 'cards') {
            container.className = 'cards-view';
            container.innerHTML = filteredMaterials.map(m => `
                <div class="material-card" data-material="${m.name}">
                    <div class="card-header"><i class="${m.icon}"></i><span class="material-badge">مادة دراسية</span></div>
                    <h3>${escapeHtml(m.name)}</h3>
                    <p class="preview">${summariesData.filter(s=>s.material===m.name).length} ملخصاً - اضغط للاستعراض</p>
                    <button class="view-material-btn"><i class="fas fa-book-open"></i> استعراض الملخصات</button>
                </div>
            `).join('');
            document.querySelectorAll('.material-card').forEach(card => {
                card.addEventListener('click', (e) => { if(e.target.tagName !== 'BUTTON') openMaterial(card.dataset.material); });
                const btn = card.querySelector('.view-material-btn');
                if(btn) btn.addEventListener('click', (e) => { e.stopPropagation(); openMaterial(card.dataset.material); });
            });
        } else {
            container.className = 'flashcards-view';
            container.innerHTML = filteredMaterials.map(m => `
                <div class="flashcard material-flashcard" data-material="${m.name}">
                    <div class="flashcard-inner"><div class="flashcard-front"><i class="${m.icon}"></i><span class="material-badge">مادة دراسية</span><h3>${escapeHtml(m.name)}</h3><small>اضغط لعرض الملخصات</small></div>
                    <div class="flashcard-back"><div>${summariesData.filter(s=>s.material===m.name).length} ملخصاً. اضغط للدخول.</div></div></div>
                </div>
            `).join('');
            document.querySelectorAll('.material-flashcard').forEach(fc => { adjustHeight(fc); fc.addEventListener('click', () => openMaterial(fc.dataset.material)); });
        }
    }

    function renderSummaries(materialName) {
        const container = document.getElementById('summariesContainer');
        const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
        let filtered = summariesData.filter(s => s.material === materialName && (searchTerm === '' || s.title.toLowerCase().includes(searchTerm) || s.preview.toLowerCase().includes(searchTerm)));
        if (filtered.length === 0) { container.innerHTML = `<div class="no-results">😔 لا توجد ملخصات في "${escapeHtml(materialName)}"</div>`; return; }
        if (currentView === 'cards') {
            container.className = 'cards-view';
            container.innerHTML = filtered.map(s => `
                <div class="card">
                    <div class="card-header"><i class="${s.icon}"></i><span class="material-badge">${escapeHtml(s.material)}</span></div>
                    <h3>${escapeHtml(s.title)}</h3>
                    <p class="preview">${escapeHtml(s.preview)}</p>
                    <div style="display:flex; gap:10px; margin-top:auto;">
                        <button class="view-btn" data-id="${s.id}" style="flex:1"><i class="fas fa-eye"></i> عرض الملخص</button>
                        <button class="quiz-btn" data-id="${s.id}" style="flex:1; background: var(--gradient-2);"><i class="fas fa-gamepad"></i> اختبر نفسك</button>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.view-btn').forEach(btn => { btn.addEventListener('click', () => { const sum = summariesData.find(s=>s.id==btn.dataset.id); if(sum) showModal(sum.title, sum.fullContent); }); });
            document.querySelectorAll('.quiz-btn').forEach(btn => { btn.addEventListener('click', () => openQuiz(parseInt(btn.dataset.id))); });
        } else {
            container.className = 'flashcards-view';
            container.innerHTML = filtered.map(s => `
                <div class="flashcard" data-id="${s.id}">
                    <div class="flashcard-inner">
                        <div class="flashcard-front"><i class="${s.icon}"></i><span class="material-badge">${escapeHtml(s.material)}</span><h3>${escapeHtml(s.title)}</h3><small>اضغط للإجابة + اختبار</small></div>
                        <div class="flashcard-back">
                            <div>${s.fullContent}<br><br>
                                <button class="quiz-flash-btn" data-id="${s.id}" style="background:var(--gradient-2); border:none; padding:8px; border-radius:40px; color:white; width:100%;"><i class="fas fa-gamepad"></i> ابدأ الاختبار</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.flashcard').forEach(fc => { adjustHeight(fc); fc.addEventListener('click', (e) => { if(e.target.classList.contains('quiz-flash-btn')) return; if(fc.classList.contains('flipped')) { fc.classList.remove('flipped'); adjustHeight(fc); } else { closeOtherFlashcards(fc); fc.classList.add('flipped'); adjustHeight(fc); } }); });
            document.querySelectorAll('.quiz-flash-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); openQuiz(parseInt(btn.dataset.id)); }); });
        }
    }

    function openMaterial(name) { currentMaterial = name; document.getElementById('subjectFilter').value = name; renderWithTransition(); }
    function goToHome() { currentMaterial = null; document.getElementById('subjectFilter').value = 'all'; document.getElementById('searchInput').value = ''; renderWithTransition(); }
    function adjustHeight(fc) { const inner = fc.querySelector('.flashcard-inner'), front = fc.querySelector('.flashcard-front'), back = fc.querySelector('.flashcard-back'); if(!inner||!front||!back) return; if(fc.classList.contains('flipped')) { const bh = back.scrollHeight; fc.style.height = bh+'px'; inner.style.height = bh+'px'; } else { const fh = front.scrollHeight; fc.style.height = fh+'px'; inner.style.height = fh+'px'; } }
    function closeOtherFlashcards(cur) { document.querySelectorAll('.flashcard').forEach(c => { if(c !== cur && c.classList.contains('flipped')){ c.classList.remove('flipped'); adjustHeight(c); } }); }
    function showModal(title, content) { let modal = document.querySelector('.modal'); if(modal) modal.remove(); modal = document.createElement('div'); modal.className = 'modal'; modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h2>${escapeHtml(title)}</h2><button class="close-btn">&times;</button></div><div class="modal-body">${content}</div></div>`; document.body.appendChild(modal); modal.querySelector('.close-btn').onclick = () => modal.remove(); modal.onclick = (e) => { if(e.target === modal) modal.remove(); }; }
    function renderContent() { currentMaterial === null ? renderMaterials() : renderSummaries(currentMaterial); }
    function renderWithTransition() { if(isTransitioning) return; const container = document.getElementById('summariesContainer'); isTransitioning = true; container.classList.add('view-transition'); setTimeout(() => { renderContent(); container.classList.remove('view-transition'); setTimeout(() => { isTransitioning = false; }, 100); }, 120); }

    // التذكير
    const reminderMessages = ["صلِّ على النبي", "اذكر الله"];
    let reminderTimeout = null;
    function showReminder() { const msg = reminderMessages[Math.floor(Math.random()*reminderMessages.length)]; const toast = document.createElement('div'); toast.className = 'reminder-toast'; toast.textContent = msg; document.body.appendChild(toast); setTimeout(() => toast.classList.add('show'), 20); toast.onclick = () => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 800); }; setTimeout(() => { if(toast && toast.parentNode) { toast.classList.add('hide'); setTimeout(() => toast.remove(), 800); } }, 5000); reminderTimeout = setTimeout(showReminder, Math.floor(Math.random() * (300000 - 180000 + 1) + 180000)); }
    function startReminders() { setTimeout(() => showReminder(), 30000); }

    function setup() {
        populateFilter();
        renderContent();
        document.getElementById('searchInput').addEventListener('input', renderWithTransition);
        document.getElementById('subjectFilter').addEventListener('change', (e) => { if(e.target.value === 'all') currentMaterial = null; else currentMaterial = e.target.value; renderWithTransition(); });
        document.querySelectorAll('.view-toggle button').forEach(btn => { btn.addEventListener('click', function() { if(this.dataset.view === currentView) return; document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active')); this.classList.add('active'); currentView = this.dataset.view; renderWithTransition(); }); });
        document.getElementById('homeLogoBtn')?.addEventListener('click', goToHome);
        document.getElementById('homeNavBtn')?.addEventListener('click', goToHome);
        startReminders();
    }
    document.addEventListener('DOMContentLoaded', setup);
</script>
</body>
</html>
